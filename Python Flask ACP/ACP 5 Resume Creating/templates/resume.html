<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Generated Resume</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: 40px auto;
    padding: 20px;
    background-color: #f9f9f9;
    color: #333;
}

h1, h2, h3 {
    color: #2c3e50;
}

form {
    background: #ffffff;
    padding: 20px;
    border-radius: 8px;
    border: 1px solid #ddd;
}

p {
    margin-bottom: 15px;
}

label {
    font-weight: bold;
    display: block;
    margin-bottom: 5px;
}

input[type="text"],
input[type="email"],
textarea {
    width: 100%;
    padding: 8px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
}

button {
    background-color: #3498db;
    color: white;
    padding: 10px 15px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background-color: #2980b9;
}

hr {
    margin: 20px 0;
    border: 0;
    border-top: 1px solid #ccc;
}
    </style>
</head>
<body>

    <h1>{{ name }}</h1>
    <p><strong>Email:</strong> {{ email }}</p>

    <hr>

    {% if about %}
        <h3>About Me</h3>
        <p>{{ about }}</p>
    {% endif %}

    {% if skills %}
        <h3>Skills</h3>
        <p>{{ skills }}</p>
    {% endif %}

    <br>
    <a href="/"> ← EDIT RESUME</a>

</body>
</html>
