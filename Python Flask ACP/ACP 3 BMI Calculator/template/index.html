<!DOCTYPE html>
<html>
<body>
    <h2>BMI Calculator</h2>
    <form method="POST">
        <p>Weight (kg): <input type="number" step="any" name="weight" required></p>
        <p>Height (cm): <input type="number" step="any" name="height" required></p>
        <button type="submit">Calculate</button>
    </form>

    {% if bmi is not none %}
        <h3>Your BMI: {{ bmi }}</h3>
        <p>Category: <strong>{{ status }}</strong></p>
    {% endif %}
</body>
</html>
